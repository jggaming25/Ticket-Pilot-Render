databases:
  - name: ticket-pilot-db
    plan: free
    databaseName: ticket_pilot
    user: ticket_pilot

services:
  - type: web
    name: ticket-pilot
    runtime: node
    plan: free
    buildCommand: npm install && npm run db:push && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ticket-pilot-db
          property: connectionString
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: ABLY_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
